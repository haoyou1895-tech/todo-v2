<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 顺手补的：没有 favicon 时每次刷新控制台都会多一条 404，验证据此不干净 -->
  <link rel="icon" href="data:," />
  <title>Todo 列表 · V4.0 React 重构版</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
      background: #f5f6f8;
      color: #333;
    }

    .todo-app {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .todo-app__title {
      margin: 0 0 20px;
      font-size: 20px;
      text-align: center;
    }

    .todo-input-area {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .todo-input-area__input {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .todo-input-area__input:focus { border-color: #4a90e2; }

    .todo-input-area__btn {
      padding: 10px 20px;
      font-size: 15px;
      color: #fff;
      background: #4a90e2;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .todo-input-area__btn:hover { background: #3a7bc8; }

    .todo-filter {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .todo-filter__btn {
      flex: 1;
      padding: 6px 0;
      font-size: 13px;
      color: #555;
      background: #f0f2f5;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .todo-filter__btn:hover { border-color: #4a90e2; color: #4a90e2; }

    .todo-filter__btn.is-active {
      background: #4a90e2;
      border-color: #4a90e2;
      color: #fff;
    }

    .todo-list { margin: 0; padding: 0; list-style: none; }

    .todo-list__item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 15px;
      line-height: 1.5;
      background: #fafafa;
      border-left: 3px solid #4a90e2;
      border-radius: 6px;
      cursor: pointer;
      word-break: break-all;
    }

    .todo-list__item.done { opacity: 0.55; }

    .todo-list__item.done .todo-list__text { text-decoration: line-through; }

    .todo-list__empty {
      padding: 16px 0;
      font-size: 13px;
      color: #999;
      text-align: center;
    }

    .todo-list__text { flex: 1; }

    .todo-list__edit,
    .todo-list__del {
      flex-shrink: 0;
      margin-left: 8px;
      width: 22px;
      height: 22px;
      font-size: 13px;
      line-height: 1;
      color: #999;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 50%;
      cursor: pointer;
    }

    .todo-list__edit:hover { color: #fff; background: #4a90e2; border-color: #4a90e2; }

    .todo-list__del:hover { color: #fff; background: #e74c3c; border-color: #e74c3c; }
  </style>
</head>

<body>
  <!--
    W11：这一整块按钮和列表从 HTML 里消失了，只剩一个挂载点。
    以前这些节点是「我写死在 HTML 里、再用 JS 去改」；
    现在 DOM 由 React 按 State 生成，HTML 只负责提供容器和样式。
  -->
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>
